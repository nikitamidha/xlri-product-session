<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nikita Midha</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#fbfaf8; --surface:#fff; --ink:#1c1917; --ink-2:#6b6560; --ink-3:#a8a29b;
    --rule:#eae5dd; --accent:#b45309; --accent-bg:#fdf4e7;
    --shadow:0 1px 2px rgba(28,25,23,.05), 0 10px 30px -14px rgba(28,25,23,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16140f; --surface:#1f1c16; --ink:#f5f1ea; --ink-2:#a9a298; --ink-3:#6f6961;
      --rule:#302b23; --accent:#e8a33d; --accent-bg:#2a2114;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg:#16140f; --surface:#1f1c16; --ink:#f5f1ea; --ink-2:#a9a298; --ink-3:#6f6961;
    --rule:#302b23; --accent:#e8a33d; --accent-bg:#2a2114;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:660px; margin:0 auto; padding:80px 28px 88px; }

  /* header */
  .head { display:flex; align-items:center; gap:28px; }
  .portrait {
    position:relative; flex:0 0 132px; width:132px; aspect-ratio:4/5;
    border-radius:12px; overflow:hidden; background:var(--accent-bg); box-shadow:var(--shadow);
  }
  .portrait img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
  .portrait .fb {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    font-size:30px; font-weight:600; color:var(--accent); letter-spacing:.02em;
  }
  .portrait .fb small {
    font-size:9px; font-weight:500; line-height:1.35; color:var(--ink-3);
    letter-spacing:.05em; text-transform:uppercase; text-align:center; padding:0 10px;
  }
  .portrait.missing img { display:none; }
  .portrait.missing .fb  { display:flex; }

  h1 { font-size:31px; font-weight:600; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--ink-2); font-size:15px; margin:0; }
  .badge {
    display:inline-block; margin-top:14px; font-size:12.5px; font-weight:500;
    color:var(--accent); background:var(--accent-bg);
    border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius:999px; padding:4px 12px;
  }

  h2 {
    font-size:11px; font-weight:600; letter-spacing:.15em; text-transform:uppercase;
    color:var(--ink-3); margin:56px 0 6px;
  }

  /* logo rows */
  .row {
    display:flex; align-items:center; gap:16px;
    padding:16px 2px; border-bottom:1px solid var(--rule);
  }
  .row:last-child { border-bottom:none; }
  .logo { flex:0 0 auto; height:24px; display:flex; align-items:center; color:var(--ink); }
  .logo svg { height:24px; width:auto; display:block; }
  .row .now { margin-left:16px; }
  .row .meta { margin-left:auto; text-align:right; font-size:13.5px; color:var(--ink-3); white-space:nowrap; }
  .row .now {
    font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-bg); border-radius:4px; padding:2px 7px;
  }

  footer { margin-top:64px; font-size:12.5px; color:var(--ink-3); }
  footer a { color:var(--accent); text-decoration:none; }

  @media (max-width:560px) {
    .wrap { padding:48px 20px 64px; }
    .head { flex-direction:column; align-items:flex-start; gap:20px; }
    .row { flex-wrap:wrap; gap:10px; }
    .logo { flex-basis:auto; }
    .row .now { margin-left:16px; }
  .row .meta { margin-left:auto; }
  }
</style>
</head>
